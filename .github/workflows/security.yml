name: Security Pipeline (DevSecOps)

# Dispara automaticamente a cada push ou pull request voltado para a branch main.
# Isso é o "Shift Left": a análise roda ANTES do código ser mesclado/entregue,
# não depois de já estar em produção.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {} 

jobs:
  # ────────────────────────────────────────────────────────────
  # 1) SAST - Static Application Security Testing
  # Analisa o código-fonte em busca de padrões inseguros (eval, segredos
  # hardcoded, etc.) sem executar a aplicação.
  # ────────────────────────────────────────────────────────────
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Rodar Semgrep (SAST)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --error \
            --json --output semgrep-results.json \
            .

      - name: Publicar relatório do Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ────────────────────────────────────────────────────────────
  # 2) SCA - Software Composition Analysis
  # Analisa as dependências (package.json / package-lock.json) em busca
  # de bibliotecas com vulnerabilidades conhecidas (CVEs publicados).
  # ────────────────────────────────────────────────────────────
  sca:
    name: SCA - npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar npm audit (SCA)
        run: npm audit --audit-level=moderate

  # ────────────────────────────────────────────────────────────
  # 3) DAST - Dynamic Application Security Testing
  # Sobe a aplicação de verdade e ataca ela "de fora", como um usuário
  # malicioso faria, procurando problemas que só aparecem em runtime
  # (headers de segurança ausentes, cookies inseguros, etc.).
  # ────────────────────────────────────────────────────────────
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [sast, sca]
    if: always()
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci

      - name: Subir a aplicação em background
        run: |
          npm start &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Aplicação no ar!"
              break
            fi
            echo "Aguardando aplicação subir... ($i/15)"
            sleep 2
          done

      - name: Rodar OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          cmd_options: "-a"

  # ────────────────────────────────────────────────────────────
  # 4) Resultado final da pipeline (gate PASS / FAIL)
  # Só "passa" se SAST, SCA e DAST tiverem passado. É o equivalente ao
  # bloco "Resultado -> PASS/FAIL" do fluxo da atividade.
  # ────────────────────────────────────────────────────────────
  resultado:
    name: Resultado Final
    runs-on: ubuntu-latest
    needs: [sast, sca, dast]
    if: always()
    steps:
      - name: Consolidar resultado da pipeline
        run: |
          echo "SAST (Semgrep): ${{ needs.sast.result }}"
          echo "SCA  (npm audit): ${{ needs.sca.result }}"
          echo "DAST (OWASP ZAP): ${{ needs.dast.result }}"
          if [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.sca.result }}" != "success" ] || \
             [ "${{ needs.dast.result }}" != "success" ]; then
            echo "❌ FAIL - vulnerabilidades/achados de segurança foram encontrados na pipeline."
            exit 1
          else
            echo "✅ PASS - nenhuma vulnerabilidade crítica encontrada."
          fi
